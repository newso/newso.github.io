<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>网站正在建设中 | 即将上线</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            color: #fff;
            padding: 20px;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
        }
        
        .logo {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #fff;
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            background: linear-gradient(to right, #fff, #a8edea);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        
        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.9;
            line-height: 1.7;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 50px 0;
            flex-wrap: wrap;
        }
        
        .feature {
            flex: 1;
            min-width: 200px;
            background-color: rgba(255, 255, 255, 0.1);
            padding: 30px 20px;
            border-radius: 15px;
            transition: transform 0.3s ease;
        }
        
        .feature:hover {
            transform: translateY(-5px);
            background-color: rgba(255, 255, 255, 0.15);
        }
        
        .feature i {
            font-size: 3rem;
            margin-bottom: 20px;
            color: #a8edea;
        }
        
        .feature h3 {
            font-size: 1.5rem;
            margin-bottom: 15px;
        }
        
        .feature p {
            font-size: 1rem;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 50px;
        }
        
        .social-links a {
            color: white;
            font-size: 2rem;
            transition: all 0.3s ease;
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.1);
        }
        
        .social-links a:hover {
            transform: translateY(-5px);
            background-color: rgba(255, 255, 255, 0.2);
            color: #a8edea;
        }
        
        .footer {
            margin-top: 50px;
            padding-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1rem;
            opacity: 0.8;
        }
        
        .contact-info {
            margin-top: 15px;
            font-size: 0.95rem;
        }
        
        .icp-info {
            margin-top: 20px;
            padding: 10px 15px;
            background-color: rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            display: inline-block;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .icp-info a {
            color: #a8edea;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        
        .icp-info a:hover {
            color: #fff;
            text-decoration: underline;
        }
.friend-links {
    margin-top: 14px;
    font-size: 13px;
    color: rgba(255,255,255,.8);
}

.friend-links a {
    color: inherit; 
    text-decoration: none;
    margin: 0 6px;
    transition: color .3s;
}

.friend-links a:hover {
    color: #a8edea;
}
        
        @media (max-width: 768px) {
            .container {
                padding: 40px 20px;
            }
            
            h1 {
                font-size: 2.2rem;
            }
            
            .subtitle {
                font-size: 1.1rem;
            }
            
            .features {
                gap: 20px;
            }
            
            .feature {
                min-width: 100%;
            }
            
            .social-links a {
                width: 50px;
                height: 50px;
                font-size: 1.5rem;
            }
            
            .logo {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <i class="fas fa-cogs"></i>
        </div>
        
        <h1>网站正在建设中</h1>
        <p class="subtitle">我们正在全力以赴打造全新网站，力求为您提供更优质的用户体验。请耐心等待，精彩即将呈现！</p>
        
        <div class="features">
            <div class="feature">
                <i class="fas fa-rocket"></i>
                <h3>全新体验</h3>
                <p>全面升级的用户界面和交互设计</p>
            </div>
            <div class="feature">
                <i class="fas fa-mobile-alt"></i>
                <h3>响应式设计</h3>
                <p>完美适配所有设备和屏幕尺寸</p>
            </div>
            <div class="feature">
                <i class="fas fa-bolt"></i>
                <h3>性能优化</h3>
                <p>极速加载，流畅的用户体验</p>
            </div>
        </div>
        
        <div class="social-links">
            <a href="#" title="微信"><i class="fab fa-weixin"></i></a>
            <a href="#" title="微博"><i class="fab fa-weibo"></i></a>
            <a href="#" title="GitHub"><i class="fab fa-github"></i></a>
            <a href="#" title="邮箱"><i class="fas fa-envelope"></i></a>
        </div>
        
        <div class="footer">
            <p>Copyright &copy; 2011-2026 Www.Newso.Net All Rights Reserved</p>

            </div>
			<div class="friend-links">
			友情链接︰<a href="http://www.baoqieyin.com/" target="_blank">宝箧印网</a>
			</div>
        </div>
    </div>
